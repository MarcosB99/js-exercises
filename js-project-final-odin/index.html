<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Calculator</title>
  </head>
  <body>
    <main class="calculator">
      <div class="display" id="display">0</div>
      <div class="buttons">
        <button class="btn clear" id="clear">AC</button>
        <button class="btn backspace" id="backspace">DEL</button>
        <button class="btn operator" data-op="/">÷</button>

        <button class="btn digit" data-num="7">7</button>
        <button class="btn digit" data-num="8">8</button>
        <button class="btn digit" data-num="9">9</button>
        <button class="btn operator" data-op="*">×</button>

        <button class="btn digit" data-num="4">4</button>
        <button class="btn digit" data-num="5">5</button>
        <button class="btn digit" data-num="6">6</button>
        <button class="btn operator" data-op="-">−</button>

        <button class="btn digit" data-num="1">1</button>
        <button class="btn digit" data-num="2">2</button>
        <button class="btn digit" data-num="3">3</button>
        <button class="btn operator" data-op="+">+</button>

        <button class="btn digit span-two" data-num="0">0</button>
        <button class="btn digit" data-num=".">.</button>
        <button class="btn equals" id="equals">=</button>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
